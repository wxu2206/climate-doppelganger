name: Feature request
description: Suggest a focused improvement.
title: "[Feature request]: "
body:
  - type: markdown
    attributes:
      value: "Please report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: "Problem or limitation"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: "Relevant application area"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
