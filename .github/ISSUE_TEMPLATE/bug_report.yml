name: Bug report
description: Report a reproducible problem.
title: "[Bug report]: "
body:
  - type: markdown
    attributes:
      value: "Please report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: "Problem description"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction steps"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "Browser and operating system"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "Selected locations and time range"
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: "Dataset version"
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: "Comparison mode"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Screenshots or errors (remove private data)"
